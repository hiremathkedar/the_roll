{% extends 'base.html' %}
{% block title %}Log In — The Roll{% endblock %}

{% block content %}
<div class="form-block">
    <h1>Log In</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="form-row">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<ul class="errorlist">{{ field.errors }}</ul>{% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Log In</button>
    </form>
</div>
{% endblock %}
